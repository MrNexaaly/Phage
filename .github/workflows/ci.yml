name: Linux x86_64 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure cache directory
        shell: bash
        run: echo "PHAGE_CACHE=$RUNNER_TEMP/phage-cache" >> "$GITHUB_ENV"
      - name: Install pinned frontend and matching LLVM tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy,llvm-tools --target x86_64-unknown-linux-gnu
          rustc -vV
          rustc -vV | grep -Fx 'release: 1.94.1'
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          rustc -vV | grep -Fx 'LLVM version: 21.1.8'
          # Follow current checked-code IR as well as the pinned build compiler.
          rustup toolchain install stable --profile minimal --component llvm-tools --target x86_64-unknown-linux-gnu
          rustup run stable rustc -vV
      - name: Install pinned solver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/solver"
          "$RUNNER_TEMP/solver/bin/python" -m pip install --only-binary=:all: z3-solver==4.16.0.0
          "$RUNNER_TEMP/solver/bin/z3" --version
          echo "$RUNNER_TEMP/solver/bin" >> "$GITHUB_PATH"
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Locked tests
        run: cargo test --locked
      - name: Runner negative controls
        run: python3 -m unittest discover -s tests -p 'test_examples_runner.py' -v
      - name: Locked release build
        run: cargo build --release --locked
      - name: Standalone end-to-end checks
        run: python3 tools/examples.py --standalone --all-toolchains
      - name: Preserve attempts, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64-evidence
          path: |
            evidence/run-*/
            results/
          if-no-files-found: warn
